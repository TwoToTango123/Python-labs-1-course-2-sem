[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-platform-lab1"
version = "0.1.0"
description = "Lab 1: task sources and contracts"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=src/task_platform --cov-report=term-missing --cov-fail-under=80"
